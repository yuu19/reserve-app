name: Publish Playwright Reports

on:
  workflow_run:
    workflows:
      - CI Tests
      - Stripe Billing E2E
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: playwright-reports-r2
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.conclusion != 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: playwright-reports
      url: ${{ steps.upload.outputs.report_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TRIGGER_RUN_ID: ${{ github.event.workflow_run.id || '' }}
      TRIGGER_WORKFLOW: ${{ github.event.workflow_run.name || '' }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      REPORT_BASE_URL: ${{ vars.PLAYWRIGHT_REPORT_BASE_URL }}
      REPORT_PREFIX: ${{ vars.PLAYWRIGHT_REPORT_PREFIX }}

    steps:
      - name: Prepare report directory
        run: mkdir -p .pages/docs .pages/web .pages/stripe-billing

      - name: Download latest Playwright reports
        shell: bash
        run: |
          set -euo pipefail

          normalize_report_dir() {
            local dir="$1"
            local nested_index=""
            local nested_dir=""
            local tmp_dir=""

            if [ -f "${dir}/index.html" ]; then
              return 0
            fi

            nested_index="$(find "${dir}" -path '*/playwright-report/index.html' -type f -print -quit)"
            if [ -z "${nested_index}" ]; then
              return 0
            fi

            nested_dir="$(dirname "${nested_index}")"
            tmp_dir="$(mktemp -d)"

            shopt -s dotglob nullglob
            cp -a "${nested_dir}"/* "${tmp_dir}"/
            rm -rf "${dir}"
            mkdir -p "${dir}"
            cp -a "${tmp_dir}"/* "${dir}"/
            shopt -u dotglob nullglob

            rm -rf "${tmp_dir}"
          }

          record_report_updated_at() {
            local env_name="$1"
            local run_id="$2"
            local title="$3"
            local updated_at=""
            local formatted_at=""

            if ! updated_at="$(gh api "repos/${REPO}/actions/runs/${run_id}" --jq '.updated_at')" || [ -z "${updated_at}" ] || [ "${updated_at}" = "null" ]; then
              echo "::warning::${title} source workflow run ${run_id} updated_at could not be read."
              formatted_at="更新日時不明"
              updated_at=""
            elif ! formatted_at="$(TZ=Asia/Tokyo date -d "${updated_at}" '+%Y-%m-%d %H:%M JST')"; then
              echo "::warning::${title} source workflow run ${run_id} updated_at (${updated_at}) could not be formatted."
              formatted_at="更新日時不明"
              updated_at=""
            fi

            {
              printf '%s=%s\n' "${env_name}" "${formatted_at}"
              printf '%s_ISO=%s\n' "${env_name}" "${updated_at}"
            } >> "$GITHUB_ENV"

            echo "${title}: source workflow run ${run_id} updated at ${formatted_at}."
          }

          download_report() {
            local workflow_name="$1"
            local artifact_name="$2"
            local target_dir="$3"
            local title="$4"
            local preferred_run_id="$5"
            local updated_at_env_name="$6"
            local run_id=""
            local run_ids=()

            rm -rf "${target_dir}"
            mkdir -p "${target_dir}"

            if [ -n "${preferred_run_id}" ]; then
              if gh run download "${preferred_run_id}" --repo "${REPO}" --name "${artifact_name}" --dir "${target_dir}"; then
                normalize_report_dir "${target_dir}"
                record_report_updated_at "${updated_at_env_name}" "${preferred_run_id}" "${title}"
                echo "${title}: downloaded ${artifact_name} from run ${preferred_run_id}."
                return 0
              fi

              echo "::warning::${title} artifact ${artifact_name} was not available on run ${preferred_run_id}."
              return 1
            fi

            mapfile -t run_ids < <(
              gh run list \
                --repo "${REPO}" \
                --workflow "${workflow_name}" \
                --branch main \
                --limit 20 \
                --json databaseId,status,conclusion,event,headBranch \
                --jq '.[] | select(.status == "completed" and .headBranch == "main" and .event != "pull_request" and (.conclusion == "success" or .conclusion == "failure")) | .databaseId'
            )

            for run_id in "${run_ids[@]}"; do
              if [ -z "${run_id}" ]; then
                continue
              fi

              rm -rf "${target_dir}"
              mkdir -p "${target_dir}"

              if gh run download "${run_id}" --repo "${REPO}" --name "${artifact_name}" --dir "${target_dir}"; then
                normalize_report_dir "${target_dir}"
                record_report_updated_at "${updated_at_env_name}" "${run_id}" "${title}"
                echo "${title}: downloaded ${artifact_name} from run ${run_id}."
                return 0
              fi

              echo "::notice::${title} artifact ${artifact_name} was not available on run ${run_id}; trying an older run."
            done

            echo "::warning::${title} artifact ${artifact_name} was not found in recent main runs."
            return 1
          }

          ci_run_id=""
          stripe_run_id=""

          if [ "${TRIGGER_WORKFLOW}" = "CI Tests" ]; then
            ci_run_id="${TRIGGER_RUN_ID}"
          fi

          if [ "${TRIGGER_WORKFLOW}" = "Stripe Billing E2E" ]; then
            stripe_run_id="${TRIGGER_RUN_ID}"
          fi

          download_report "CI Tests" "playwright-report-docs" ".pages/docs" "Docs report" "${ci_run_id}" "DOCS_REPORT_UPDATED_AT" || true
          download_report "CI Tests" "playwright-report-web" ".pages/web" "Web report" "${ci_run_id}" "WEB_REPORT_UPDATED_AT" || true
          download_report "Stripe Billing E2E" "playwright-report-stripe-billing" ".pages/stripe-billing" "Stripe Billing report" "${stripe_run_id}" "STRIPE_BILLING_REPORT_UPDATED_AT" || true

      - name: Create missing report placeholders
        shell: bash
        run: |
          set -euo pipefail

          write_placeholder() {
            local dir="$1"
            local title="$2"
            local message="$3"

            if [ -f "${dir}/index.html" ]; then
              return 0
            fi

            cat > "${dir}/index.html" <<HTML
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>${title}</title>
            </head>
            <body>
              <main>
                <h1>${title}</h1>
                <p>${message}</p>
              </main>
            </body>
          </html>
          HTML
          }

          write_placeholder ".pages/docs" "Docs report unavailable" "No docs Playwright report artifact was available for the latest main branch run."
          write_placeholder ".pages/web" "Web report unavailable" "No web Playwright report artifact was available for the latest main branch run."
          write_placeholder ".pages/stripe-billing" "Stripe Billing report unavailable" "No Stripe Billing Playwright report artifact was available for the latest main branch run."

      - name: Create report index
        shell: bash
        run: |
          set -euo pipefail

          report_meta_html() {
            local label="$1"
            local datetime="$2"

            if [ "${label}" = "未生成" ] || [ "${label}" = "更新日時不明" ]; then
              printf '<span class="report-link__status">%s</span>' "${label}"
              return 0
            fi

            if [ -n "${datetime}" ]; then
              printf '<time datetime="%s">%s</time>' "${datetime}" "${label}"
              return 0
            fi

            printf '<time>%s</time>' "${label}"
          }

          docs_report_updated_at="${DOCS_REPORT_UPDATED_AT:-未生成}"
          web_report_updated_at="${WEB_REPORT_UPDATED_AT:-未生成}"
          stripe_billing_report_updated_at="${STRIPE_BILLING_REPORT_UPDATED_AT:-未生成}"

          cat > .pages/index.html <<HTML
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>Playwright Reports</title>
              <style>
                :root {
                  color-scheme: light dark;
                  font-family:
                    Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                }
                body {
                  margin: 0;
                  min-height: 100vh;
                  display: grid;
                  place-items: center;
                  background: Canvas;
                  color: CanvasText;
                }
                main {
                  width: min(720px, calc(100% - 48px));
                }
                h1 {
                  margin: 0 0 12px;
                  font-size: 2rem;
                  line-height: 1.2;
                }
                p {
                  margin: 0 0 24px;
                  color: color-mix(in srgb, CanvasText 70%, transparent);
                }
                ul {
                  display: grid;
                  gap: 12px;
                  padding: 0;
                  margin: 0;
                  list-style: none;
                }
                a {
                  display: flex;
                  align-items: center;
                  justify-content: space-between;
                  gap: 12px 20px;
                  padding: 16px 18px;
                  border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
                  border-radius: 8px;
                  color: inherit;
                  text-decoration: none;
                  font-weight: 700;
                }
                .report-link__name {
                  min-width: 0;
                }
                time,
                .report-link__status {
                  flex: 0 0 auto;
                  color: color-mix(in srgb, CanvasText 62%, transparent);
                  font-size: 0.875rem;
                  font-weight: 600;
                  white-space: nowrap;
                }
                a:hover,
                a:focus-visible {
                  border-color: color-mix(in srgb, CanvasText 46%, transparent);
                }
                @media (max-width: 520px) {
                  a {
                    align-items: flex-start;
                    flex-direction: column;
                  }
                  time,
                  .report-link__status {
                    white-space: normal;
                  }
                }
              </style>
            </head>
            <body>
              <main>
                <h1>Playwright Reports</h1>
                <p>Latest available reports generated from main branch workflows.</p>
                <ul>
                  <li>
                    <a href="./docs/index.html">
                      <span class="report-link__name">Docs report</span>
                      $(report_meta_html "${docs_report_updated_at}" "${DOCS_REPORT_UPDATED_AT_ISO:-}")
                    </a>
                  </li>
                  <li>
                    <a href="./web/index.html">
                      <span class="report-link__name">Web report</span>
                      $(report_meta_html "${web_report_updated_at}" "${WEB_REPORT_UPDATED_AT_ISO:-}")
                    </a>
                  </li>
                  <li>
                    <a href="./stripe-billing/index.html">
                      <span class="report-link__name">Stripe Billing report</span>
                      $(report_meta_html "${stripe_billing_report_updated_at}" "${STRIPE_BILLING_REPORT_UPDATED_AT_ISO:-}")
                    </a>
                  </li>
                </ul>
              </main>
            </body>
          </html>
          HTML

      - name: Upload reports to R2
        id: upload
        if: always()
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail

          required_env=(
            "AWS_ACCESS_KEY_ID"
            "AWS_SECRET_ACCESS_KEY"
            "R2_BUCKET"
            "REPORT_BASE_URL"
          )

          for name in "${required_env[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} is required for publishing Playwright reports to R2."
              exit 1
            fi
          done

          if [ "${R2_ENDPOINT}" = "https://.r2.cloudflarestorage.com" ]; then
            echo "::error::R2_ACCOUNT_ID is required for publishing Playwright reports to R2."
            exit 1
          fi

          prefix="${REPORT_PREFIX#/}"
          prefix="${prefix%/}"

          if [ -n "${prefix}" ]; then
            s3_uri="s3://${R2_BUCKET}/${prefix}/"
            report_root_url="${REPORT_BASE_URL%/}/${prefix}"
          else
            s3_uri="s3://${R2_BUCKET}/"
            report_root_url="${REPORT_BASE_URL%/}"
          fi

          report_url="${report_root_url}/index.html"

          aws s3 sync .pages "${s3_uri}" \
            --endpoint-url "${R2_ENDPOINT}" \
            --delete \
            --cache-control "no-store"

          put_directory_index_alias() {
            local source_file="$1"
            local key="$2"

            if [ -z "${key}" ] || [ ! -f "${source_file}" ]; then
              return 0
            fi

            aws s3api put-object \
              --bucket "${R2_BUCKET}" \
              --key "${key}" \
              --body "${source_file}" \
              --endpoint-url "${R2_ENDPOINT}" \
              --content-type "text/html; charset=utf-8" \
              --cache-control "no-store" \
              >/dev/null
          }

          if [ -n "${prefix}" ]; then
            put_directory_index_alias ".pages/index.html" "${prefix}/"
            put_directory_index_alias ".pages/docs/index.html" "${prefix}/docs/"
            put_directory_index_alias ".pages/web/index.html" "${prefix}/web/"
            put_directory_index_alias ".pages/stripe-billing/index.html" "${prefix}/stripe-billing/"
          fi

          echo "report_url=${report_url}" >> "$GITHUB_OUTPUT"

          {
            echo "### Playwright Reports"
            echo ""
            echo "- Index: ${report_url}"
            echo "- Docs: ${report_root_url}/docs/index.html"
            echo "- Web: ${report_root_url}/web/index.html"
            echo "- Stripe Billing: ${report_root_url}/stripe-billing/index.html"
          } >> "$GITHUB_STEP_SUMMARY"

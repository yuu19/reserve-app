name: Publish Playwright Reports

on:
  workflow_run:
    workflows:
      - CI Tests
      - Stripe Billing E2E
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: playwright-pages
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.conclusion != 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TRIGGER_RUN_ID: ${{ github.event.workflow_run.id || '' }}
      TRIGGER_WORKFLOW: ${{ github.event.workflow_run.name || '' }}

    steps:
      - name: Prepare report directory
        run: mkdir -p .pages/docs .pages/web .pages/stripe-billing

      - name: Download latest Playwright reports
        shell: bash
        run: |
          set -euo pipefail

          normalize_report_dir() {
            local dir="$1"
            local nested_index=""
            local nested_dir=""
            local tmp_dir=""

            if [ -f "${dir}/index.html" ]; then
              return 0
            fi

            nested_index="$(find "${dir}" -path '*/playwright-report/index.html' -type f -print -quit)"
            if [ -z "${nested_index}" ]; then
              return 0
            fi

            nested_dir="$(dirname "${nested_index}")"
            tmp_dir="$(mktemp -d)"

            shopt -s dotglob nullglob
            cp -a "${nested_dir}"/* "${tmp_dir}"/
            rm -rf "${dir}"
            mkdir -p "${dir}"
            cp -a "${tmp_dir}"/* "${dir}"/
            shopt -u dotglob nullglob

            rm -rf "${tmp_dir}"
          }

          download_report() {
            local workflow_name="$1"
            local artifact_name="$2"
            local target_dir="$3"
            local title="$4"
            local preferred_run_id="$5"
            local run_id=""
            local run_ids=()

            rm -rf "${target_dir}"
            mkdir -p "${target_dir}"

            if [ -n "${preferred_run_id}" ]; then
              if gh run download "${preferred_run_id}" --repo "${REPO}" --name "${artifact_name}" --dir "${target_dir}"; then
                normalize_report_dir "${target_dir}"
                echo "${title}: downloaded ${artifact_name} from run ${preferred_run_id}."
                return 0
              fi

              echo "::warning::${title} artifact ${artifact_name} was not available on run ${preferred_run_id}."
              return 1
            fi

            mapfile -t run_ids < <(
              gh run list \
                --repo "${REPO}" \
                --workflow "${workflow_name}" \
                --branch main \
                --limit 20 \
                --json databaseId,status,conclusion,event,headBranch \
                --jq '.[] | select(.status == "completed" and .headBranch == "main" and .event != "pull_request" and (.conclusion == "success" or .conclusion == "failure")) | .databaseId'
            )

            for run_id in "${run_ids[@]}"; do
              if [ -z "${run_id}" ]; then
                continue
              fi

              rm -rf "${target_dir}"
              mkdir -p "${target_dir}"

              if gh run download "${run_id}" --repo "${REPO}" --name "${artifact_name}" --dir "${target_dir}"; then
                normalize_report_dir "${target_dir}"
                echo "${title}: downloaded ${artifact_name} from run ${run_id}."
                return 0
              fi

              echo "::notice::${title} artifact ${artifact_name} was not available on run ${run_id}; trying an older run."
            done

            echo "::warning::${title} artifact ${artifact_name} was not found in recent main runs."
            return 1
          }

          ci_run_id=""
          stripe_run_id=""

          if [ "${TRIGGER_WORKFLOW}" = "CI Tests" ]; then
            ci_run_id="${TRIGGER_RUN_ID}"
          fi

          if [ "${TRIGGER_WORKFLOW}" = "Stripe Billing E2E" ]; then
            stripe_run_id="${TRIGGER_RUN_ID}"
          fi

          download_report "CI Tests" "playwright-report-docs" ".pages/docs" "Docs report" "${ci_run_id}" || true
          download_report "CI Tests" "playwright-report-web" ".pages/web" "Web report" "${ci_run_id}" || true
          download_report "Stripe Billing E2E" "playwright-report-stripe-billing" ".pages/stripe-billing" "Stripe Billing report" "${stripe_run_id}" || true

      - name: Create missing report placeholders
        shell: bash
        run: |
          set -euo pipefail

          write_placeholder() {
            local dir="$1"
            local title="$2"
            local message="$3"

            if [ -f "${dir}/index.html" ]; then
              return 0
            fi

            cat > "${dir}/index.html" <<HTML
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>${title}</title>
            </head>
            <body>
              <main>
                <h1>${title}</h1>
                <p>${message}</p>
              </main>
            </body>
          </html>
          HTML
          }

          write_placeholder ".pages/docs" "Docs report unavailable" "No docs Playwright report artifact was available for the latest main branch run."
          write_placeholder ".pages/web" "Web report unavailable" "No web Playwright report artifact was available for the latest main branch run."
          write_placeholder ".pages/stripe-billing" "Stripe Billing report unavailable" "No Stripe Billing Playwright report artifact was available for the latest main branch run."

      - name: Create report index
        run: |
          cat > .pages/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>Playwright Reports</title>
              <style>
                :root {
                  color-scheme: light dark;
                  font-family:
                    Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                }
                body {
                  margin: 0;
                  min-height: 100vh;
                  display: grid;
                  place-items: center;
                  background: Canvas;
                  color: CanvasText;
                }
                main {
                  width: min(720px, calc(100% - 48px));
                }
                h1 {
                  margin: 0 0 12px;
                  font-size: 2rem;
                  line-height: 1.2;
                }
                p {
                  margin: 0 0 24px;
                  color: color-mix(in srgb, CanvasText 70%, transparent);
                }
                ul {
                  display: grid;
                  gap: 12px;
                  padding: 0;
                  margin: 0;
                  list-style: none;
                }
                a {
                  display: block;
                  padding: 16px 18px;
                  border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
                  border-radius: 8px;
                  color: inherit;
                  text-decoration: none;
                  font-weight: 700;
                }
                a:hover,
                a:focus-visible {
                  border-color: color-mix(in srgb, CanvasText 46%, transparent);
                }
              </style>
            </head>
            <body>
              <main>
                <h1>Playwright Reports</h1>
                <p>Latest available reports generated from main branch workflows.</p>
                <ul>
                  <li><a href="./docs/">Docs report</a></li>
                  <li><a href="./web/">Web report</a></li>
                  <li><a href="./stripe-billing/">Stripe Billing report</a></li>
                </ul>
              </main>
            </body>
          </html>
          HTML

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

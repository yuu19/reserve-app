name: CI Tests

on:
  pull_request:
    paths:
      - 'apps/backend/**'
      - 'apps/docs/**'
      - 'apps/web/**'
      - 'packages/saas-billing-core/**'
      - 'packages/saas-billing-drizzle/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/**'
      - 'turbo.json'
      - '.github/workflows/ci-tests.yml'
      - '.github/workflows/deploy-workers.yml'
      - '.github/workflows/publish-playwright-reports.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/backend/**'
      - 'apps/docs/**'
      - 'apps/web/**'
      - 'packages/saas-billing-core/**'
      - 'packages/saas-billing-drizzle/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/**'
      - 'turbo.json'
      - '.github/workflows/ci-tests.yml'
      - '.github/workflows/deploy-workers.yml'
      - '.github/workflows/publish-playwright-reports.yml'

permissions:
  contents: read

concurrency:
  group: ci-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run backend tests
        run: pnpm --filter @apps/backend test:coverage

      - name: Run web server tests
        run: pnpm --filter @apps/web test:coverage

      - name: Typecheck shared billing core
        run: pnpm --filter @repo/saas-billing-core typecheck

      - name: Test shared billing core
        run: pnpm --filter @repo/saas-billing-core test

      - name: Typecheck shared billing Drizzle store
        run: pnpm --filter @repo/saas-billing-drizzle typecheck

      - name: Test shared billing Drizzle store
        run: pnpm --filter @repo/saas-billing-drizzle test

      - name: Write Vitest coverage summary
        run: node scripts/write-vitest-coverage-summary.mjs "Backend=apps/backend/coverage/coverage-summary.json" "Web server=apps/web/coverage/server/coverage-summary.json"

      - name: Upload Vitest coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: vitest-coverage
          path: |
            apps/backend/coverage/
            apps/web/coverage/server/
          if-no-files-found: ignore
          retention-days: 30

      - name: Build docs worker
        run: pnpm --filter @apps/docs build

  docs-e2e:
    name: docs-e2e
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @apps/docs exec playwright install --with-deps chromium

      - name: Run docs Playwright E2E
        run: pnpm --filter @apps/docs test:e2e

      - name: Upload docs Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-docs
          path: apps/docs/playwright-report/
          if-no-files-found: ignore
          retention-days: 30

  web-e2e:
    name: web-e2e
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @apps/web exec playwright install --with-deps chromium

      - name: Run web Playwright E2E
        run: pnpm --filter @apps/web test:e2e

      - name: Upload web Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-web
          path: apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload web Playwright artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts-web
          path: |
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 30
